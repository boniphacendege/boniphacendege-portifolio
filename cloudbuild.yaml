# ==============================================================================
# Google Cloud Build Pipeline for Boniphace Ndege Portfolio
# Automatically builds container image and deploys to Google Cloud Run
# ==============================================================================

steps:
  # 1. Build container image using multi-stage Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/boniphace-portfolio:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/boniphace-portfolio:latest'
      - '.'

  # 2. Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/boniphace-portfolio:$COMMIT_SHA'

  # 3. Deploy directly to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'boniphace-portfolio'
      - '--image=gcr.io/$PROJECT_ID/boniphace-portfolio:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'

images:
  - 'gcr.io/$PROJECT_ID/boniphace-portfolio:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/boniphace-portfolio:latest'

options:
  logging: CLOUD_LOGGING_ONLY
