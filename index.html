    <script>
      // Suppress harmless Vite HMR WebSocket connection errors and Firestore backend reachability notices in preview iframe
      (function () {
        var origConsoleError = console.error;
        var origConsoleWarn = console.warn;
        function isIgnoredNotice(args) {
          try {
            var combined = Array.prototype.slice.call(args).map(function (a) {
              return typeof a === 'string' ? a : (a && (a.message || a.stack)) || String(a);
            }).join(' ');
            return (
              combined.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
              combined.indexOf("backend didn't respond within 10 seconds") !== -1 ||
              combined.indexOf("Backend didn't respond within 10 seconds") !== -1 ||
              combined.indexOf('Please check your Firebase configuration') !== -1 ||
              combined.indexOf('the client is offline') !== -1 ||
              combined.indexOf('Failed to get document because the client is offline') !== -1
            );
          } catch (e) {
            return false;
          }
        }
        console.error = function () {
          if (isIgnoredNotice(arguments)) {
            return;
          }
          origConsoleError.apply(console, arguments);
        };
        console.warn = function () {
          if (isIgnoredNotice(arguments)) {
            return;
          }
          origConsoleWarn.apply(console, arguments);
        };
      })();
      window.addEventListener('unhandledrejection', function (e) {
        if (e && e.reason) {
          var msg = String(e.reason.message || e.reason);
          var stack = String(e.reason.stack || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            stack.indexOf('@vite/client') !== -1 ||
            msg.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
            msg.indexOf("backend didn't respond within 10 seconds") !== -1 ||
            msg.indexOf("Backend didn't respond within 10 seconds") !== -1 ||
            msg.indexOf('Please check your Firebase configuration') !== -1 ||
            msg.indexOf('the client is offline') !== -1
          ) {
            e.preventDefault();
          }
        }
      });
      window.addEventListener('error', function (e) {
        if (e) {
          var msg = String(e.message || '');
          var file = String(e.filename || '');
          if (
            msg.indexOf('WebSocket') !== -1 ||
            file.indexOf('@vite/client') !== -1 ||
            msg.indexOf('Could not reach Cloud Firestore backend') !== -1 ||
            msg.indexOf("backend didn't respond within 10 seconds") !== -1 ||
            msg.indexOf("Backend didn't respond within 10 seconds") !== -1 ||
            msg.indexOf('Please check your Firebase configuration') !== -1 ||
            msg.indexOf('the client is offline') !== -1
          ) {
            e.preventDefault();
          }
        }
      });
    </script>
